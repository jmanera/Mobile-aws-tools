name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  # Run by hand to get a debug APK; pushes and pull requests only lint and test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Go bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l ssmbridge cmd)"
      - run: go vet ./...
      - run: go test -race ./...

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK in $ANDROID_HOME.
      - name: Install SDK platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Build bridge AAR
        # Lint only needs the bridge's classes, so one ABI is enough unless an APK is wanted.
        env:
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && 'android/arm64,android/amd64' || 'android/arm64' }}
        run: bridge/build-aar.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug
      - name: Assemble debug APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        run: ./gradlew assembleDebug
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
